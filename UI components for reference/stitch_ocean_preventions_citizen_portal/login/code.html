<body class="bg-background min-h-screen flex items-center justify-center p-container-padding-mobile md:p-container-padding-desktop">
<!-- Login Card Container -->
<main class="w-full max-w-5xl bg-surface rounded-xl shadow-[0_12px_24px_rgba(0,61,155,0.1)] flex overflow-hidden border border-outline-variant md:flex-row flex-col">
<!-- Left Side: Hero Graphic (Desktop Only) -->
<section class="hidden md:block md:w-1/2 relative bg-primary-container overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center opacity-80 mix-blend-overlay" data-alt="A serene yet commanding wide-angle view of a coastal city skyline at twilight, viewed from the ocean. The water is deep, calm blue, reflecting the city lights. Modern infrastructure is visible, conveying a sense of safety, civic duty, and environmental stewardship. The color palette emphasizes primary blues, crisp whites, and subtle urban glows, fitting a high-end government-tech application." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAtWNT6ZVV5fqP_kVcI5L3Nksay_C4_VedeL-DR8liKP-7crPAhjm5qq_FeOWaCJj1wYrm9k-g5UKm84mHe9OeyGVUIFSgYK_ZECXyEDwQ4-oc7pIyb88uuJtwxA52RyGH-cSKqY4eBYu_icKTkleZYSzdROfAcv_OGYhywY_qd4WokGMjWEUhVAcv2vWZYfByNTZMqX0-9Np6Kyw5DBxff-7Riskg76Y0xm1fQZKht0uyNz6_Xxh4JYQ')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-primary/90 to-transparent flex flex-col justify-end p-container-padding-desktop">
<div class="flex items-center gap-2 mb-stack-md">
<span class="material-symbols-outlined text-on-primary text-4xl" style="font-variation-settings: 'FILL' 1;">waves</span>
<span class="font-headline-md text-headline-md text-on-primary">Ocean Preventions</span>
</div>
<p class="font-body-lg text-body-lg text-on-primary-container max-w-md">Empowering coastal communities through rapid response and environmental stewardship.</p>
</div>
</section>
<!-- Right Side: Form Content -->
<section class="w-full md:w-1/2 p-container-padding-mobile md:p-container-padding-desktop flex flex-col justify-center bg-surface">
<!-- Mobile Logo (Hidden on Desktop) -->
<div class="flex items-center gap-2 mb-stack-lg md:hidden">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">waves</span>
<span class="font-headline-md text-headline-md text-primary">Ocean Preventions</span>
</div>
<!-- Headers -->
<header class="mb-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-stack-sm">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Report issues. Make your city safer.</p>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Mobile Number Input -->
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface" for="mobile">Mobile Number</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant">call</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="mobile" name="mobile" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-unit">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant">lock</span>
<input class="w-full h-14 pl-12 pr-12 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Primary Action -->
<div class="mt-stack-sm flex flex-col gap-stack-md items-center">
<button class="w-full h-[56px] bg-primary text-on-primary font-label-md text-label-md rounded-full shadow-[0_4px_12px_rgba(0,61,155,0.2)] hover:bg-primary-container transition-all active:scale-[0.98]" type="submit">
                        Login
                    </button>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">
                        Continue with OTP
                    </a>
</div>
<!-- Divider -->
<div class="relative flex items-center py-stack-sm">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-label-sm text-label-sm text-on-surface-variant uppercase">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Secondary Action -->
<button class="w-full h-[56px] bg-transparent border border-primary text-primary font-label-md text-label-md rounded-full hover:bg-surface-container-low transition-colors active:scale-[0.98]" type="button">
                    Create Account
                </button>
</form>
</section>
