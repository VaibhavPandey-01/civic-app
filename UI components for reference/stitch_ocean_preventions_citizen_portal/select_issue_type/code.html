<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Select Issue Type</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#003d9b",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f1f3ff",
                        "tertiary": "#851800",
                        "primary-fixed-dim": "#b2c5ff",
                        "on-background": "#041b3c",
                        "tertiary-container": "#b02300",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#434654",
                        "on-primary-container": "#c4d2ff",
                        "on-secondary-container": "#00734c",
                        "on-secondary-fixed-variant": "#005235",
                        "on-surface": "#041b3c",
                        "surface-container": "#e8edff",
                        "on-secondary-fixed": "#002113",
                        "primary-container": "#0052cc",
                        "background": "#f9f9ff",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#ffdad2",
                        "surface-container-highest": "#d7e2ff",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#1d3052",
                        "surface-dim": "#cadaff",
                        "surface-container-high": "#e0e8ff",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#ffb4a3",
                        "primary-fixed": "#dae2ff",
                        "surface-tint": "#0c56d0",
                        "inverse-on-surface": "#edf0ff",
                        "secondary-fixed-dim": "#65dca4",
                        "inverse-primary": "#b2c5ff",
                        "surface-bright": "#f9f9ff",
                        "on-primary-fixed": "#001848",
                        "on-primary-fixed-variant": "#0040a2",
                        "outline-variant": "#c3c6d6",
                        "on-primary": "#ffffff",
                        "surface": "#f9f9ff",
                        "on-tertiary-container": "#ffc6b9",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#8b1a00",
                        "on-tertiary-fixed": "#3d0600",
                        "outline": "#737685",
                        "error": "#ba1a1a",
                        "secondary": "#006c47",
                        "secondary-container": "#82f9be",
                        "surface-variant": "#d7e2ff",
                        "secondary-fixed": "#82f9be"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding-desktop": "40px",
                        "container-padding-mobile": "20px",
                        "unit": "8px",
                        "gutter": "16px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .pulse-animation {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(186, 26, 26, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(186, 26, 26, 0); }
            100% { box-shadow: 0 0 0 0 rgba(186, 26, 26, 0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen text-on-background selection:bg-primary-container selection:text-on-primary-container pb-safe">
<!-- TopAppBar (Transactional - Hidden on Desktop per logic, but active here as header) -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline flat no shadows flex items-center justify-between px-container-padding-mobile h-16 w-full z-40">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors active:opacity-70">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-primary dark:text-primary-fixed-dim text-center flex-1 pr-12">
            Ocean Preventions
        </h1>
</header>
<main class="px-container-padding-mobile md:px-container-padding-desktop max-w-4xl mx-auto pt-stack-lg pb-stack-lg flex flex-col gap-stack-lg">
<div class="text-center">
<h2 class="font-headline-lg text-headline-lg-mobile md:font-display-lg md:text-display-lg text-on-surface mb-stack-sm">Select Issue Type</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Choose the category that best describes your report.</p>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Environmental Issue Card -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-lg p-6 shadow-[0_4px_12px_rgba(0,61,155,0.1)] hover:bg-surface-container-low transition-all active:scale-[0.98] text-left flex flex-col h-full group focus:outline-none focus:ring-2 focus:ring-primary">
<div class="w-14 h-14 rounded-full bg-secondary-container flex items-center justify-center mb-stack-md shrink-0">
<span class="material-symbols-outlined text-on-secondary-container text-[32px]" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<h3 class="font-headline-md text-headline-md-mobile text-on-surface mb-stack-sm group-hover:text-primary transition-colors">Environmental Issue</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-md flex-1">Report incidents affecting the marine ecosystem and coastlines.</p>
<div class="flex flex-wrap gap-2 mt-auto">
<span class="font-label-sm text-label-sm px-3 py-1 bg-surface-container text-on-surface-variant rounded-full">Garbage Dump</span>
<span class="font-label-sm text-label-sm px-3 py-1 bg-surface-container text-on-surface-variant rounded-full">Plastic Waste</span>
<span class="font-label-sm text-label-sm px-3 py-1 bg-surface-container text-on-surface-variant rounded-full">Pollution</span>
</div>
</button>
<!-- Safety Issue Card -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-lg p-6 shadow-[0_4px_12px_rgba(0,61,155,0.1)] hover:bg-surface-container-low transition-all active:scale-[0.98] text-left flex flex-col h-full group focus:outline-none focus:ring-2 focus:ring-primary">
<div class="w-14 h-14 rounded-full bg-[#ffeed2] flex items-center justify-center mb-stack-md shrink-0">
<span class="material-symbols-outlined text-[#855100] text-[32px]" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<h3 class="font-headline-md text-headline-md-mobile text-on-surface mb-stack-sm group-hover:text-primary transition-colors">Safety Issue</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-md flex-1">Report hazards or suspicious activities that pose immediate risks.</p>
<div class="flex flex-wrap gap-2 mt-auto">
<span class="font-label-sm text-label-sm px-3 py-1 bg-surface-container text-on-surface-variant rounded-full">Suspicious Object</span>
<span class="font-label-sm text-label-sm px-3 py-1 bg-surface-container text-on-surface-variant rounded-full">Vessel Hazard</span>
<span class="font-label-sm text-label-sm px-3 py-1 bg-surface-container text-on-surface-variant rounded-full">Navigational Risk</span>
</div>
</button>
</div>
<div class="mt-stack-lg">
<button class="w-full bg-error text-on-error rounded-full h-[72px] flex items-center justify-center gap-3 shadow-[0_8px_24px_rgba(186,26,26,0.25)] hover:bg-[#93000a] transition-all active:scale-[0.98] pulse-animation focus:outline-none focus:ring-4 focus:ring-error-container">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">emergency</span>
<span class="font-headline-md text-headline-md-mobile md:text-headline-md font-bold uppercase tracking-wider">Emergency SOS</span>
</button>
<p class="font-label-sm text-label-sm text-center text-on-surface-variant mt-stack-sm">Hold or tap for immediate life-threatening situations.</p>
</div>
</main>
<!-- Suppress Navigation Shell on linear transactional flow -->
</body></html>
