<button aria-label="Go back" class="text-on-surface-variant hover:bg-surface-container-low transition-colors active:opacity-70 rounded-full p-2 -ml-2">

</button>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-primary truncate px-4">Ocean Preventions</h1>
<div class="h-8 w-8 rounded-full bg-surface-container-high overflow-hidden shrink-0 border border-outline-variant/30">

<!-- Image Preview Card -->
<section class="px-container-padding-mobile pt-6 pb-2">
<div class="relative w-full h-56 rounded-[1rem] overflow-hidden bg-surface-container shadow-[0_4px_12px_rgba(0,61,155,0.05)] border border-outline-variant/50 group">

<div class="absolute inset-0 bg-gradient-to-b from-black/20 to-transparent pointer-events-none"></div>
<button aria-label="Retake photo" class="absolute top-3 right-3 bg-surface/90 backdrop-blur text-on-surface p-2 rounded-full shadow-[0_4px_12px_rgba(0,61,155,0.1)] hover:bg-surface-container-highest transition-colors active:scale-95">
<span class="material-symbols-outlined text-[20px]">photo_camera</span>
</button>
</div>
</section>
<!-- Auto-detected Info (Bento Grid) -->
<section class="px-container-padding-mobile py-4 space-y-3">
<h2 class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase pl-1">Auto-detected Info</h2>
<div class="grid grid-cols-2 gap-3">
<!-- Location -->
<div class="bg-surface border border-outline-variant/60 rounded-[1rem] p-4 flex flex-col gap-2 shadow-[0_2px_8px_rgba(0,61,155,0.03)] hover:shadow-[0_4px_12px_rgba(0,61,155,0.08)] transition-shadow">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">location_on</span>
<span class="font-label-sm text-label-sm">GPS Data</span>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface truncate">34.0083° N</p>
<p class="font-label-md text-label-md text-on-surface truncate">118.4988° W</p>
</div>
</div>
<!-- Time -->
<div class="bg-surface border border-outline-variant/60 rounded-[1rem] p-4 flex flex-col gap-2 shadow-[0_2px_8px_rgba(0,61,155,0.03)] hover:shadow-[0_4px_12px_rgba(0,61,155,0.08)] transition-shadow">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">schedule</span>
<span class="font-label-sm text-label-sm">Timestamp</span>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface">14:23 PST</p>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-0.5">Today</p>
</div>
</div>
</div>

<div class="flex items-center gap-3">
<div class="h-10 w-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">

</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Detected Category</p>
<p class="font-body-md text-body-md text-on-surface font-medium">Garbage Dump</p>
</div>
</div>
<button class="text-primary hover:text-primary-container transition-colors p-1 rounded-full hover:bg-surface-container">
<span class="material-symbols-outlined text-[20px]">edit</span>
</button>
</div>
</section>

<label class="block font-label-md text-label-md text-on-surface mb-2 pl-1" for="report-description">Description</label>

<textarea class="w-full bg-surface border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 rounded-[1rem] p-4 font-body-md text-body-md text-on-surface placeholder:text-outline outline-none resize-none shadow-sm transition-all" id="report-description" placeholder="Describe the issue location and condition..." rows="4"></textarea>
<div class="absolute bottom-3 right-4 flex items-center gap-1 text-on-surface-variant bg-surface px-1">
<span class="material-symbols-outlined text-[16px]">mic</span>
</div>
</div>
</section>

<section class="px-container-padding-mobile py-2 mb-8">
<h2 class="font-label-md text-label-md text-on-surface mb-3 pl-1">Priority Level</h2>
<div class="flex gap-2 bg-surface-container-lowest p-1 rounded-full border border-outline-variant/50">
<button class="flex-1 py-2.5 px-4 rounded-full font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-primary/30">
                    Low

<button class="flex-1 py-2.5 px-4 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md font-bold shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-secondary/30 relative">
                    Medium
                    <span class="absolute inset-0 rounded-full ring-1 ring-inset ring-secondary/20 pointer-events-none"></span>
</button>
<button class="flex-1 py-2.5 px-4 rounded-full font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-primary/30">
                    High

</div>
</section>
