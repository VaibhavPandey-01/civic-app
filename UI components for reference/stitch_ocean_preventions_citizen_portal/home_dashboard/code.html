<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Ocean Preventions - Home Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#003d9b",
                    "on-error": "#ffffff",
                    "surface-container-low": "#f1f3ff",
                    "tertiary": "#851800",
                    "primary-fixed-dim": "#b2c5ff",
                    "on-background": "#041b3c",
                    "tertiary-container": "#b02300",
                    "surface-container-lowest": "#ffffff",
                    "on-surface-variant": "#434654",
                    "on-primary-container": "#c4d2ff",
                    "on-secondary-container": "#00734c",
                    "on-secondary-fixed-variant": "#005235",
                    "on-surface": "#041b3c",
                    "surface-container": "#e8edff",
                    "on-secondary-fixed": "#002113",
                    "primary-container": "#0052cc",
                    "background": "#f9f9ff",
                    "on-error-container": "#93000a",
                    "tertiary-fixed": "#ffdad2",
                    "surface-container-highest": "#d7e2ff",
                    "on-secondary": "#ffffff",
                    "inverse-surface": "#1d3052",
                    "surface-dim": "#cadaff",
                    "surface-container-high": "#e0e8ff",
                    "error-container": "#ffdad6",
                    "tertiary-fixed-dim": "#ffb4a3",
                    "primary-fixed": "#dae2ff",
                    "surface-tint": "#0c56d0",
                    "inverse-on-surface": "#edf0ff",
                    "secondary-fixed-dim": "#65dca4",
                    "inverse-primary": "#b2c5ff",
                    "surface-bright": "#f9f9ff",
                    "on-primary-fixed": "#001848",
                    "on-primary-fixed-variant": "#0040a2",
                    "outline-variant": "#c3c6d6",
                    "on-primary": "#ffffff",
                    "surface": "#f9f9ff",
                    "on-tertiary-container": "#ffc6b9",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed-variant": "#8b1a00",
                    "on-tertiary-fixed": "#3d0600",
                    "outline": "#737685",
                    "error": "#ba1a1a",
                    "secondary": "#006c47",
                    "secondary-container": "#82f9be",
                    "surface-variant": "#d7e2ff",
                    "secondary-fixed": "#82f9be"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-padding-desktop": "40px",
                    "container-padding-mobile": "20px",
                    "unit": "8px",
                    "gutter": "16px",
                    "stack-sm": "8px",
                    "stack-md": "16px",
                    "stack-lg": "32px",
                    "safe": "env(safe-area-inset-bottom)"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Inter"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "display-lg": ["Inter"],
                    "headline-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "label-sm": ["Inter"],
                    "label-md": ["Inter"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        body { -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 16px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden pb-24">
<!-- Header Section -->
<header class="w-full flex items-center justify-between px-container-padding-mobile pt-8 pb-4">
<div>
<p class="font-body-md text-on-surface-variant">Good morning,</p>
<h1 class="font-headline-lg-mobile text-on-background">Vaibhav</h1>
</div>
<div class="flex items-center gap-gutter">
<button class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-primary relative">
<span class="material-symbols-outlined">notifications</span>
<span class="absolute top-3 right-3 w-3 h-3 bg-error rounded-full border-2 border-surface-container-highest"></span>
</button>
<div class="w-12 h-12 rounded-full overflow-hidden border-2 border-surface-container-highest shadow-sm">
<img alt="Profile" class="w-full h-full object-cover" data-alt="A close-up portrait of a professional citizen scientist looking optimistic in soft morning sunlight. Light-mode aesthetic, corporate modern vibe with subtle blue and white tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBmQfLhVZakEov1U57kGBh_JNFsNGM6xFxs_0asz64wznsH_XgRWuyTvo9i8AG_WLy2Xi_-iVOR6TvFoZNVMAI_al5DvOhm4MCY2O4Dwn1iqKdVVQ4m02WXu5jrn_rfDemutBCbiIwpssuu2-GfkTV708M2LjaVR1ba0Npj_d6N1wSCwWVEpfGmxItA301AEmup5XeoKtGTA8z66GtwQkolo_CZzlhkOn7T2gIahb8MSgtb-ZqGek2ztQ"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-container-padding-mobile flex flex-col gap-stack-lg">
<!-- Hero: Report an Issue -->
<section class="w-full">
<h2 class="font-headline-md text-on-background mb-stack-md">Report an Issue</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Environmental Issue Button -->
<button class="bg-secondary text-on-secondary rounded-lg p-6 flex flex-col items-start gap-4 shadow-[0_4px_12px_rgba(0,108,71,0.15)] active:scale-95 transition-transform">
<div class="w-14 h-14 bg-secondary-container text-on-secondary-container rounded-full flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-3xl">delete</span>
</div>
<div class="text-left">
<h3 class="font-headline-md">Environmental</h3>
<p class="font-body-md opacity-90 mt-1">Pollution, debris, or wildlife hazards.</p>
</div>
</button>
<!-- Safety Issue Button -->
<button class="bg-tertiary-container text-on-error rounded-lg p-6 flex flex-col items-start gap-4 shadow-[0_4px_12px_rgba(176,35,0,0.15)] active:scale-95 transition-transform">
<div class="w-14 h-14 bg-tertiary-fixed text-on-tertiary-fixed rounded-full flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-3xl">warning</span>
</div>
<div class="text-left">
<h3 class="font-headline-md">Safety Hazard</h3>
<p class="font-body-md opacity-90 mt-1">Suspicious items, dangerous conditions.</p>
</div>
</button>
</div>
</section>
<!-- Recent Reports List -->
<section class="w-full">
<div class="flex items-center justify-between mb-stack-md">
<h2 class="font-headline-md text-on-background">My Recent Reports</h2>
<button class="text-primary font-label-md hover:underline">View All</button>
</div>
<div class="flex flex-col gap-gutter">
<!-- Report Card 1 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-4 flex gap-4 shadow-[0_4px_12px_rgba(0,61,155,0.05)]">
<div class="w-20 h-20 rounded-lg overflow-hidden shrink-0">
<img alt="Report Thumbnail" class="w-full h-full object-cover" data-alt="A close-up shot of washed-up plastic debris on a sandy beach during overcast daytime. The image has a calm, clinical light-mode aesthetic, focusing on the environmental impact." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB4Bxe7g7M4FfJbGZW8hQPCvUIauKX2LTbOFtIEHK_LOCoefkyWFoVs0DNZ8QXiQ3GfC_Vrf4vzWkPzumdOFv5SS-mSyrjxmIlyxt126Eo8wO9t5R62g5tQTN6wL8v71Wzntxl5Zr2OWGDG1Hr6X8Xoo5-Ljs9RrRH45Vb5WEO1o8VMsRKygf0XHspB4LVaO9_0NJlSS1prhts4_BkNIcFbsR18W33lSfLNZiCMauxKQiLHwCxcf4Qhnw"/>
</div>
<div class="flex-1 flex flex-col justify-between">
<div>
<div class="flex justify-between items-start">
<span class="bg-secondary-container text-on-secondary-container font-label-sm px-3 py-1 rounded-full">Pollution</span>
<span class="font-label-sm text-on-surface-variant">Oct 12</span>
</div>
<h4 class="font-body-lg text-on-background font-semibold mt-1">Beach Debris</h4>
</div>
<div class="flex items-center gap-2 mt-2">
<span class="w-2 h-2 rounded-full bg-surface-tint"></span>
<span class="font-label-sm text-primary">Under Review</span>
</div>
</div>
</div>
<!-- Report Card 2 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-4 flex gap-4 shadow-[0_4px_12px_rgba(0,61,155,0.05)]">
<div class="w-20 h-20 rounded-lg overflow-hidden shrink-0 bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-outline text-3xl">image_not_supported</span>
</div>
<div class="flex-1 flex flex-col justify-between">
<div>
<div class="flex justify-between items-start">
<span class="bg-tertiary-fixed text-on-tertiary-fixed font-label-sm px-3 py-1 rounded-full">Hazard</span>
<span class="font-label-sm text-on-surface-variant">Oct 10</span>
</div>
<h4 class="font-body-lg text-on-background font-semibold mt-1">Unmarked Barrels</h4>
</div>
<div class="flex items-center gap-2 mt-2">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span class="font-label-sm text-secondary">Assigned</span>
</div>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom Navigation Bar (Generated from JSON) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 bg-surface shadow-[0_-4px_12px_rgba(0,61,155,0.1)] flex justify-around items-center h-20 px-4 pb-safe">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-2xl px-4 py-1 scale-95 active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined fill" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</button>
<!-- Reports -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all scale-95 active:scale-90 duration-200 rounded-2xl">
<span class="material-symbols-outlined">assignment</span>
<span class="font-label-sm text-label-sm mt-1">Reports</span>
</button>
<!-- Alerts -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all scale-95 active:scale-90 duration-200 rounded-2xl">
<span class="material-symbols-outlined">notifications</span>
<span class="font-label-sm text-label-sm mt-1">Alerts</span>
</button>
<!-- Profile -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all scale-95 active:scale-90 duration-200 rounded-2xl">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>
</button>
</nav>
</body></html>
